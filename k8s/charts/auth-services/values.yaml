# Service names are fixed (not prefixed with the release name) because they must match
# the hostnames in each project's appsettings.Docker.json and ApiGateway/ocelot.Docker.json.

# The services reuse the "Docker" environment: in-cluster they reach each other by
# service name over plain HTTP, exactly like in docker-compose.
aspnetcoreEnvironment: Docker

image:
  # Images are built locally and loaded into kind (see k8s/deploy.sh), so never pull them.
  tag: local
  pullPolicy: IfNotPresent

# Secret holding MSSQL_SA_PASSWORD, shared by SQL Server and IdentityServer.
secret:
  # Name of the Secret. k8s/deploy.sh creates it from the repo-root .env file.
  name: identity-db-secret
  # Set to true (with saPassword) to have the chart create the Secret instead.
  # Note: values passed to Helm are stored in the release history.
  create: false
  saPassword: ""

identityDb:
  name: identity-db
  image: mcr.microsoft.com/mssql/server:2022-latest
  port: 1433
  storage:
    size: 5Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
  # SQL Server refuses to start with less than 2 GB of memory.
  resources:
    requests:
      cpu: 250m
      memory: 2Gi
    limits:
      memory: 3Gi

# Service registry. Inventories.API registers with it and the API Gateway resolves
# the API through it (see appsettings.Docker.json / ocelot.Docker.json).
consul:
  name: consul
  image: hashicorp/consul:1.20
  port: 8500
  # Mapped to host port 8500 in k8s/kind-config.yaml for the Consul UI.
  nodePort: 30500
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Distributed cache. Inventories.API caches inventory reads in it, IdentityServer its
# configuration store, and IdentityServer + the client their Data Protection keys
# (see the "Redis" section of each appsettings.Docker.json).
redis:
  name: redis
  image: redis:7-alpine
  port: 6379
  storage:
    size: 1Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Telemetry backend: every service exports traces, metrics and logs to it over OTLP
# (see the "OpenTelemetry" section of each appsettings.Docker.json).
otelLgtm:
  name: otel-lgtm
  image: grafana/otel-lgtm:0.34.0
  # Mapped to host port 3000 in k8s/kind-config.yaml for Grafana.
  grafanaNodePort: 30300
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1536Mi

# One Deployment + NodePort Service per entry. nodePort matches the host port
# mapping in k8s/kind-config.yaml.
apps:
  identityserver:
    image: auth-services/identityserver
    nodePort: 30203
    # Receives MSSQL_SA_PASSWORD and waits for identity-db before starting.
    usesIdentityDb: true
    # Probed over HTTP when probePath is set; services without an anonymous endpoint get a TCP probe.
    probePath: /.well-known/openid-configuration
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  inventories-api:
    image: auth-services/inventories-api
    nodePort: 30017
    probePath: /health
    # Registers its pod IP with Consul so the API Gateway can discover it.
    registersWithConsul: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  apigateway:
    image: auth-services/apigateway
    nodePort: 30232
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

  inventories-client:
    image: auth-services/inventories-client
    nodePort: 30181
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# Image used by IdentityServer's init container to wait for the database.
waitImage: busybox:1.36

containerPort: 8080
