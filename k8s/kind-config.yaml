# Local cluster for the auth-services chart: kind create cluster --config k8s/kind-config.yaml
# Maps each NodePort to the same host port docker-compose uses, so the browser URLs
# (and the IssuerUri / redirect URIs configured for them) are unchanged.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: auth-services
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30203 # identityserver
        hostPort: 5203
      - containerPort: 30017 # inventories-api
        hostPort: 5017
      - containerPort: 30232 # apigateway
        hostPort: 7232
      - containerPort: 30181 # inventories-client
        hostPort: 5181
