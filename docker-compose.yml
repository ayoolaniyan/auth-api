services:
  identity-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: identityserver-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Read from .env (see .env-example)
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}"
    ports:
      - "1433:1433"
    volumes:
      - identity-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Service registry: Inventories.API registers itself here and the API Gateway
  # looks it up by name. Dev mode keeps the catalog in memory; UI at http://localhost:8500
  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"
    # Lets Consul health-check the API when it runs on the host with `dotnet run`
    # (built into Docker Desktop; needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 10

  identityserver:
    build:
      context: .
      dockerfile: IdentityServer/Dockerfile
    container_name: identityserver
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set in .env}"
    ports:
      - "5203:8080"
    depends_on:
      identity-db:
        condition: service_healthy

  inventories-api:
    build:
      context: .
      dockerfile: Inventories.API/Dockerfile
    container_name: inventories-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5017:8080"
    depends_on:
      identityserver:
        condition: service_started
      consul:
        condition: service_healthy

  apigateway:
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    container_name: apigateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "7232:8080"
    depends_on:
      identityserver:
        condition: service_started
      inventories-api:
        condition: service_started
      consul:
        condition: service_healthy

  inventories-client:
    build:
      context: .
      dockerfile: Inventories.Client/Dockerfile
    container_name: inventories-client
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "5181:8080"
    depends_on:
      - identityserver
      - apigateway

volumes:
  identity-db-data:
